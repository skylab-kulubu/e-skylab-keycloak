name: full-ci label

# Labelling a pull request full-ci starts the whole suite at once: a manual ci.yml run
# (workflow_dispatch, always full) on the pull request's branch. ci.yml itself also reads the label
# on the pull request's next push. ci.yml does not run on "labeled": a run for any other label
# would report a skipped gate, and GitHub counts a skipped required check as passed, so it could
# hide a failed gate of the same commit. Here another label only skips this workflow's own job.
# The manual run tests the branch's head (not GitHub's merge commit) and leaves its own gate on it.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: full-ci-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: write }
    steps:
      - name: Start the whole suite on the pull request's branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ $HEAD_REPOSITORY != "$GITHUB_REPOSITORY" ]]; then
            echo "::warning title=full-ci::a fork's branch cannot be run here; ci.yml reads the label on the next push"
            exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
          echo "::notice title=full-ci::whole suite started on $HEAD_REF (Actions, workflow CI, event workflow_dispatch)"
