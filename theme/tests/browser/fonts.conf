<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Screenshot runner only (scripts/update-visual-baselines.sh and the CI theme job).
  The Playwright Linux image resolves the generic UI families to a CJK face without
  a bold weight; bind them to Liberation Sans so the baselines show real weights and
  Turkish glyphs. Production browsers never see this file.
-->
<fontconfig>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
