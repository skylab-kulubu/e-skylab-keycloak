name: Release

on:
  push:
    branches:
      - production
    tags:
      - 'v*'

jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    # Same image as ci.yml and theme/scripts/update-visual-baselines.sh: the committed
    # screenshot baselines are compared byte for byte here, not on the bare runner.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    env:
      SL_VISUAL_BASELINE_ENV: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: theme/package-lock.json

      - name: Pin the screenshot fonts exactly as the baseline script does
        run: |
          mkdir -p "$HOME/.config/fontconfig"
          cp theme/tests/browser/fonts.conf "$HOME/.config/fontconfig/fonts.conf"

      - name: Unit, Chromium and screenshot baseline tests of the login theme
        working-directory: theme
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm test
          npm run test:browser

      - name: Keep screenshot diffs when the visual baselines drift
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: theme-visual-diffs
          path: theme/test-results
          if-no-files-found: ignore
          retention-days: 7

  keycloak-build:
    runs-on: ubuntu-latest
    needs: theme
    environment: keycloak-production
    permissions: { contents: read }
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    env:
      KEYCLOAK_TEST_IMAGE: e-skylab-keycloak-candidate:${{ github.sha }}
      PUBLISH_IMAGE: ghcr.io/skylab-kulubu/e-skylab-keycloak
      PHYSICAL_WEBAUTHN_APPROVED_COMMIT: ${{ vars.KEYCLOAK_PHYSICAL_WEBAUTHN_APPROVED_COMMIT }}
      PHYSICAL_WEBAUTHN_EVIDENCE_URL: ${{ vars.KEYCLOAK_PHYSICAL_WEBAUTHN_EVIDENCE_URL }}
      PHYSICAL_WEBAUTHN_APPROVED_SURFACES: ${{ vars.KEYCLOAK_PHYSICAL_WEBAUTHN_APPROVED_SURFACES }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the release to point at current production
        run: |
          git fetch --no-tags origin production
          release_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          production_commit=$(git rev-parse origin/production)
          if [[ "$release_commit" != "$production_commit" ]]; then
            echo "The Keycloak release must point at the current production commit." >&2
            exit 1
          fi

      - name: Verify Keycloak and fixture image pins
        run: |
          bash tests/check-version-consistency.sh
          bash tests/check-fresh-runner.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: theme/package-lock.json

      - name: Build the source-controlled login theme and check its contract
        working-directory: theme
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npm run build-keycloak-theme
          bash ../tests/check-theme-contract.sh

      - uses: docker/setup-buildx-action@v4

      - name: Extract and validate version
        id: get_version
        run: |
          approved_version=$(sed -n \
            's|^ARG KEYCLOAK_IMAGE=.*keycloak:\([^@]*\)@sha256:.*|\1|p' \
            Dockerfile)

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version=${GITHUB_REF#refs/tags/v}
            if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "The Keycloak release tag must contain a semantic version." >&2
              exit 1
            fi
            if [[ "$version" != "$approved_version" ]]; then
              echo "Tag version $version does not match image version $approved_version." >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF" == "refs/heads/production" ]]; then
            version=$approved_version
          else
            echo "Only the production branch and semantic version tags may publish Keycloak." >&2
            exit 1
          fi

          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Build candidate image once
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.KEYCLOAK_TEST_IMAGE }}

      - name: Test candidate image
        run: bash tests/run-integration.sh

      - name: Require physical WebAuthn rollout evidence for this commit
        run: bash tests/check-physical-webauthn-release.sh

      - name: Package the tested image bytes
        run: |
          artifact_dir="$RUNNER_TEMP/keycloak-candidate"
          mkdir -p "$artifact_dir"
          docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE" > "$artifact_dir/image-id"
          printf '%s\n' "$GITHUB_SHA" > "$artifact_dir/commit-sha"
          printf '%s\n' "${{ steps.get_version.outputs.VERSION }}" > "$artifact_dir/version"
          docker save "$KEYCLOAK_TEST_IMAGE" | gzip -1 > "$artifact_dir/candidate-image.tar.gz"

          provider_dir="$RUNNER_TEMP/tested-keycloak-providers"
          mkdir -p "$provider_dir"
          candidate_container=$(docker create "$KEYCLOAK_TEST_IMAGE")
          trap 'docker rm -f "$candidate_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$candidate_container:/opt/keycloak/providers/." "$provider_dir/"
          test "$(find "$provider_dir" -maxdepth 1 -type f -name 'e-skylab-theme-*.jar' | wc -l | tr -d ' ')" = 1
          cp "$provider_dir/e-skylab-theme-2.0.1.jar" "$artifact_dir/"
          THEME_JAR="$artifact_dir/e-skylab-theme-2.0.1.jar" \
            bash tests/check-theme-contract.sh
          (
            cd "$artifact_dir"
            sha256sum candidate-image.tar.gz e-skylab-theme-2.0.1.jar > SHA256SUMS
          )

      - name: Upload the commit-bound tested candidate
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/keycloak-candidate
          if-no-files-found: error
          retention-days: 1

  keycloak-publish:
    needs: keycloak-build
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    env:
      KEYCLOAK_TEST_IMAGE: e-skylab-keycloak-candidate:${{ github.sha }}
      PUBLISH_IMAGE: ghcr.io/skylab-kulubu/e-skylab-keycloak
    steps:
      - uses: actions/checkout@v7

      - name: Download the tested candidate
        uses: actions/download-artifact@v5
        with:
          name: keycloak-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/keycloak-candidate

      - name: Verify and load the tested candidate
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/keycloak-candidate
          VERSION: ${{ needs.keycloak-build.outputs.version }}
        run: |
          test "$(cat "$CANDIDATE_DIR/commit-sha")" = "$GITHUB_SHA"
          test "$(cat "$CANDIDATE_DIR/version")" = "$VERSION"
          (
            cd "$CANDIDATE_DIR"
            sha256sum --check SHA256SUMS
          )
          gzip -dc "$CANDIDATE_DIR/candidate-image.tar.gz" | docker load
          test "$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")" = "$(cat "$CANDIDATE_DIR/image-id")"

          provider_dir="$RUNNER_TEMP/keycloak-providers"
          mkdir -p "$provider_dir"
          candidate_container=$(docker create "$KEYCLOAK_TEST_IMAGE")
          trap 'docker rm -f "$candidate_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$candidate_container:/opt/keycloak/providers/." "$provider_dir/"
          test "$(find "$provider_dir" -maxdepth 1 -type f -name 'e-skylab-theme-*.jar' | wc -l | tr -d ' ')" = 1
          cmp "$provider_dir/e-skylab-theme-2.0.1.jar" "$CANDIDATE_DIR/e-skylab-theme-2.0.1.jar"
          THEME_JAR="$CANDIDATE_DIR/e-skylab-theme-2.0.1.jar" \
            bash tests/check-theme-contract.sh

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image bytes
        env:
          VERSION: ${{ needs.keycloak-build.outputs.version }}
        run: |
          commit_image="$PUBLISH_IMAGE:sha-$GITHUB_SHA"
          production_image="$PUBLISH_IMAGE:production"
          candidate_id=$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")

          published_images=(
            "$commit_image"
            "$production_image"
          )

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            published_images+=(
              "$PUBLISH_IMAGE:$VERSION"
              "$PUBLISH_IMAGE:latest"
            )
          fi

          for image in "${published_images[@]}"; do
            docker tag "$KEYCLOAK_TEST_IMAGE" "$image"
            test "$(docker image inspect --format '{{.Id}}' "$image")" = "$candidate_id"
            docker push "$image"
          done

          commit_digest="sha256:$(docker buildx imagetools inspect --raw "$commit_image" | sha256sum | cut -d' ' -f1)"
          for image in "${published_images[@]:1}"; do
            alias_digest="sha256:$(docker buildx imagetools inspect --raw "$image" | sha256sum | cut -d' ' -f1)"
            test "$commit_digest" = "$alias_digest"
          done

          {
            echo "### Tested Keycloak artifact"
            echo
            echo "\`$commit_image@$commit_digest\`"
            echo
            echo "Production alias: \`production\`"
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo
              echo "Version aliases: \`$VERSION\`, \`latest\`"
            fi
            echo
            echo "Candidate commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger the production Dokploy deployment
        if: github.ref == 'refs/heads/production'
        env:
          DOKPLOY_DEPLOY_HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
        run: |
          if [[ -z "$DOKPLOY_DEPLOY_HOOK" ]]; then
            echo "DOKPLOY_DEPLOY_HOOK is required for production deployment." >&2
            exit 1
          fi

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          response_code=$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --user-agent 'DokployDeployHook/1.0' \
              --request POST \
              "$DOKPLOY_DEPLOY_HOOK"
          )

          echo "Dokploy hook HTTP $response_code"
          if [[ ! "$response_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Dokploy did not accept the production deployment request." >&2
            exit 1
          fi
