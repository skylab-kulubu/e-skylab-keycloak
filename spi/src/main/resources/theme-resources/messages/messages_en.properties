# sky-account: personal e-mail confirmation mail (K3c). The values are MessageFormat
# patterns, so an apostrophe has to be written twice.
skyPersonalEmailConfirmSubject=Confirm your personal e-mail address
skyPersonalEmailConfirmIntro=You asked to add this address ({0}) as the personal e-mail of your {1} account. Enter the code below on the Account Center page you have open.
skyPersonalEmailConfirmExpiry=This code is valid for {0} minutes and can be used only once.
skyPersonalEmailConfirmNeverShare=Do not share this code with anyone. The {0} team will never call or write to ask you for it.
skyPersonalEmailConfirmIgnore=If this was not you, ignore this mail; nothing on your account changes.
