name: Release

on:
  push:
    branches:
      - production
    tags:
      - 'v*'

# One release at a time; a queued run waits instead of cancelling the one in progress. Each run
# still checks before its gate and before publishing that it points at current production.
concurrency:
  group: keycloak-release
  cancel-in-progress: false

jobs:
  # No build and no tests here: ci.yml tested this tree in full (every job, every integration
  # group on one candidate image) on the push to main, and that run's candidate artifact is
  # promoted. keycloak-build finds the run (tests/find-green-full-ci-run.sh), downloads the
  # candidate and every group's receipt, and requires each receipt to name exactly these bytes
  # (SHA-256 and image ID) and this tree. keycloak-package then requires the physical WebAuthn
  # evidence of this exact production commit and packages the same bytes; keycloak-publish pushes
  # them. A hotfix tree main never tested: production's own push run of ci.yml is full; re-run this
  # release (gh run rerun --failed) once it is green.
  keycloak-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, actions: read }
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      ci-run: ${{ steps.ci_run.outputs.run-id }}
      image-id: ${{ steps.candidate.outputs.image-id }}
      image-sha256: ${{ steps.candidate.outputs.image-sha256 }}
    env:
      KEYCLOAK_TEST_IMAGE: e-skylab-keycloak-candidate:ci
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the release to point at current production
        run: |
          git fetch --no-tags origin production
          release_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          production_commit=$(git rev-parse origin/production)
          if [[ "$release_commit" != "$production_commit" ]]; then
            echo "The Keycloak release must point at the current production commit." >&2
            exit 1
          fi

      # production is a squash of main, so the tree is compared, not the commit.
      - name: Require a fully green full CI run of this tree
        id: ci_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse "${GITHUB_SHA}^{tree}")
          run_id=$(bash tests/find-green-full-ci-run.sh "$tree")
          [[ $run_id =~ ^[0-9]+$ ]]
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Verify Keycloak and fixture image pins
        run: |
          bash tests/check-version-consistency.sh
          bash tests/check-fresh-runner.sh

      - name: Extract and validate version
        id: get_version
        run: |
          approved_version=$(sed -n \
            's|^ARG KEYCLOAK_IMAGE=.*keycloak:\([^@]*\)@sha256:.*|\1|p' \
            Dockerfile)

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version=${GITHUB_REF#refs/tags/v}
            if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "The Keycloak release tag must contain a semantic version." >&2
              exit 1
            fi
            if [[ "$version" != "$approved_version" ]]; then
              echo "Tag version $version does not match image version $approved_version." >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF" == "refs/heads/production" ]]; then
            version=$approved_version
          else
            echo "Only the production branch and semantic version tags may publish Keycloak." >&2
            exit 1
          fi

          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Download the tested candidate of that run
        uses: actions/download-artifact@v5
        with:
          name: keycloak-ci-candidate
          path: ${{ runner.temp }}/keycloak-ci-candidate
          run-id: ${{ steps.ci_run.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Download the integration groups' receipts of that run
        uses: actions/download-artifact@v5
        with:
          pattern: keycloak-ci-tested-*
          merge-multiple: true
          path: ${{ runner.temp }}/keycloak-ci-tested
          run-id: ${{ steps.ci_run.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Require every integration group to have tested these bytes
        id: candidate
        run: |
          set -o pipefail
          candidate_dir="$RUNNER_TEMP/keycloak-ci-candidate"
          receipt_dir="$RUNNER_TEMP/keycloak-ci-tested"
          tree=$(git rev-parse "${GITHUB_SHA}^{tree}")
          image_id=$(cat "$candidate_dir/image-id")
          image_sha256=$(cat "$candidate_dir/image-sha256")
          [[ $image_sha256 =~ ^[0-9a-f]{64}$ && $image_id =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(cat "$candidate_dir/tree")" = "$tree"
          printf '%s  %s\n' "$image_sha256" "$candidate_dir/candidate-image.tar.gz" | sha256sum --check --strict
          groups=$(sed -n 's/^INTEGRATION_GROUPS=(\([^)]*\))$/\1/p' tests/run-integration.sh)
          read -r -a group_list <<<"$groups"
          if [[ ${#group_list[@]} -eq 0 ]]; then
            echo "tests/run-integration.sh lists no INTEGRATION_GROUPS." >&2
            exit 1
          fi
          for group in "${group_list[@]}"; do
            expected=$(printf 'group=%s\ntree=%s\nimage-id=%s\nimage-sha256=%s\n' \
              "$group" "$tree" "$image_id" "$image_sha256")
            if [[ ! -f "$receipt_dir/$group" || "$(cat "$receipt_dir/$group")" != "$expected" ]]; then
              echo "Integration group $group has no receipt for image $image_id of tree $tree." >&2
              exit 1
            fi
          done
          test "$(find "$receipt_dir" -type f | wc -l | tr -d ' ')" = "${#group_list[@]}"
          gzip -dc "$candidate_dir/candidate-image.tar.gz" | docker load
          test "$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")" = "$image_id"
          echo "image-id=$image_id" >> "$GITHUB_OUTPUT"
          echo "image-sha256=$image_sha256" >> "$GITHUB_OUTPUT"

  # Runs only when keycloak-build found and checked the tested candidate (needs). It loads the same
  # tarball, then requires the physical WebAuthn evidence (the keycloak-production environment's
  # variables), and only then packages those bytes for keycloak-publish.
  keycloak-package:
    runs-on: ubuntu-latest
    needs: keycloak-build
    environment: keycloak-production
    timeout-minutes: 30
    permissions: { contents: read, actions: read }
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      KEYCLOAK_TEST_IMAGE: e-skylab-keycloak-candidate:ci
      IMAGE_ID: ${{ needs.keycloak-build.outputs.image-id }}
      IMAGE_SHA256: ${{ needs.keycloak-build.outputs.image-sha256 }}
      VERSION: ${{ needs.keycloak-build.outputs.version }}
      PHYSICAL_WEBAUTHN_APPROVED_COMMIT: ${{ vars.KEYCLOAK_PHYSICAL_WEBAUTHN_APPROVED_COMMIT }}
      PHYSICAL_WEBAUTHN_EVIDENCE_URL: ${{ vars.KEYCLOAK_PHYSICAL_WEBAUTHN_EVIDENCE_URL }}
      PHYSICAL_WEBAUTHN_APPROVED_SURFACES: ${{ vars.KEYCLOAK_PHYSICAL_WEBAUTHN_APPROVED_SURFACES }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the tested candidate
        uses: actions/download-artifact@v5
        with:
          name: keycloak-ci-candidate
          path: ${{ runner.temp }}/keycloak-ci-candidate
          run-id: ${{ needs.keycloak-build.outputs.ci-run }}
          github-token: ${{ github.token }}

      - name: Require the release to still point at current production
        run: |
          production_commit=$(git ls-remote --exit-code origin refs/heads/production | cut -f1)
          if [[ "$production_commit" != "$GITHUB_SHA" ]]; then
            echo "production moved to $production_commit; this run of $GITHUB_SHA must not continue." >&2
            exit 1
          fi

      - name: Require physical WebAuthn rollout evidence for this commit
        run: bash tests/check-physical-webauthn-release.sh

      - name: Package the tested image bytes
        id: package
        run: |
          set -o pipefail
          [[ -n $VERSION ]]
          [[ $IMAGE_SHA256 =~ ^[0-9a-f]{64}$ && $IMAGE_ID =~ ^sha256:[0-9a-f]{64}$ ]]
          tested="$RUNNER_TEMP/keycloak-ci-candidate/candidate-image.tar.gz"
          printf '%s  %s\n' "$IMAGE_SHA256" "$tested" | sha256sum --check --strict
          gzip -dc "$tested" | docker load
          test "$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")" = "$IMAGE_ID"

          artifact_dir="$RUNNER_TEMP/keycloak-candidate"
          mkdir -p "$artifact_dir"
          docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE" > "$artifact_dir/image-id"
          printf '%s\n' "$GITHUB_SHA" > "$artifact_dir/commit-sha"
          printf '%s\n' "$VERSION" > "$artifact_dir/version"
          # The tarball every integration group of the CI run loaded, not a fresh docker save.
          cp "$tested" "$artifact_dir/candidate-image.tar.gz"

          provider_dir="$RUNNER_TEMP/tested-keycloak-providers"
          mkdir -p "$provider_dir"
          candidate_container=$(docker create "$KEYCLOAK_TEST_IMAGE")
          trap 'docker rm -f "$candidate_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$candidate_container:/opt/keycloak/providers/." "$provider_dir/"
          test "$(find "$provider_dir" -maxdepth 1 -type f -name 'e-skylab-theme-*.jar' | wc -l | tr -d ' ')" = 1
          cp "$provider_dir/e-skylab-theme-2.0.1.jar" "$artifact_dir/"
          THEME_JAR="$artifact_dir/e-skylab-theme-2.0.1.jar" \
            bash tests/check-theme-contract.sh
          (
            cd "$artifact_dir"
            sha256sum candidate-image.tar.gz e-skylab-theme-2.0.1.jar > SHA256SUMS
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload the commit-bound tested candidate
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/keycloak-candidate
          if-no-files-found: error
          # Three days: long enough for the physical WebAuthn evidence and a re-run of a failed
          # job (README); a later re-run must start the whole run again.
          retention-days: 3

  # Re-runs of a failed publish (gh run rerun --failed) run only this job, so it checks again that
  # the release still points at current production and binds the bytes to keycloak-build's outputs.
  keycloak-publish:
    needs: [keycloak-build, keycloak-package]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    env:
      KEYCLOAK_TEST_IMAGE: e-skylab-keycloak-candidate:ci
      PUBLISH_IMAGE: ghcr.io/skylab-kulubu/e-skylab-keycloak
      IMAGE_ID: ${{ needs.keycloak-build.outputs.image-id }}
      IMAGE_SHA256: ${{ needs.keycloak-build.outputs.image-sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the tested candidate
        uses: actions/download-artifact@v5
        with:
          name: keycloak-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/keycloak-candidate

      - name: Verify and load the tested candidate
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/keycloak-candidate
          VERSION: ${{ needs.keycloak-package.outputs.version }}
        run: |
          test "$(cat "$CANDIDATE_DIR/commit-sha")" = "$GITHUB_SHA"
          test "$(cat "$CANDIDATE_DIR/version")" = "$VERSION"
          (
            cd "$CANDIDATE_DIR"
            sha256sum --check SHA256SUMS
          )
          # The same bytes keycloak-build built and every integration group tested.
          [[ $IMAGE_SHA256 =~ ^[0-9a-f]{64}$ && $IMAGE_ID =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$IMAGE_SHA256" "$CANDIDATE_DIR/candidate-image.tar.gz" | sha256sum --check --strict
          test "$(cat "$CANDIDATE_DIR/image-id")" = "$IMAGE_ID"
          gzip -dc "$CANDIDATE_DIR/candidate-image.tar.gz" | docker load
          test "$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")" = "$(cat "$CANDIDATE_DIR/image-id")"
          test "$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")" = "$IMAGE_ID"

          provider_dir="$RUNNER_TEMP/keycloak-providers"
          mkdir -p "$provider_dir"
          candidate_container=$(docker create "$KEYCLOAK_TEST_IMAGE")
          trap 'docker rm -f "$candidate_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$candidate_container:/opt/keycloak/providers/." "$provider_dir/"
          test "$(find "$provider_dir" -maxdepth 1 -type f -name 'e-skylab-theme-*.jar' | wc -l | tr -d ' ')" = 1
          cmp "$provider_dir/e-skylab-theme-2.0.1.jar" "$CANDIDATE_DIR/e-skylab-theme-2.0.1.jar"
          THEME_JAR="$CANDIDATE_DIR/e-skylab-theme-2.0.1.jar" \
            bash tests/check-theme-contract.sh

      - uses: docker/setup-buildx-action@v4

      - name: Require the release to still point at current production
        run: |
          production_commit=$(git ls-remote --exit-code origin refs/heads/production | cut -f1)
          if [[ "$production_commit" != "$GITHUB_SHA" ]]; then
            echo "production moved to $production_commit; this run of $GITHUB_SHA must not publish." >&2
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image bytes
        env:
          VERSION: ${{ needs.keycloak-package.outputs.version }}
        run: |
          commit_image="$PUBLISH_IMAGE:sha-$GITHUB_SHA"
          production_image="$PUBLISH_IMAGE:production"
          candidate_id=$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")

          published_images=(
            "$commit_image"
            "$production_image"
          )

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            published_images+=(
              "$PUBLISH_IMAGE:$VERSION"
              "$PUBLISH_IMAGE:latest"
            )
          fi

          for image in "${published_images[@]}"; do
            docker tag "$KEYCLOAK_TEST_IMAGE" "$image"
            test "$(docker image inspect --format '{{.Id}}' "$image")" = "$candidate_id"
            docker push "$image"
          done

          commit_digest="sha256:$(docker buildx imagetools inspect --raw "$commit_image" | sha256sum | cut -d' ' -f1)"
          for image in "${published_images[@]:1}"; do
            alias_digest="sha256:$(docker buildx imagetools inspect --raw "$image" | sha256sum | cut -d' ' -f1)"
            test "$commit_digest" = "$alias_digest"
          done

          {
            echo "### Tested Keycloak artifact"
            echo
            echo "\`$commit_image@$commit_digest\`"
            echo
            echo "Production alias: \`production\`"
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo
              echo "Version aliases: \`$VERSION\`, \`latest\`"
            fi
            echo
            echo "Candidate commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger the production Dokploy deployment
        if: github.ref == 'refs/heads/production'
        env:
          DOKPLOY_DEPLOY_HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
        run: |
          if [[ -z "$DOKPLOY_DEPLOY_HOOK" ]]; then
            echo "DOKPLOY_DEPLOY_HOOK is required for production deployment." >&2
            exit 1
          fi

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          response_code=$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --user-agent 'DokployDeployHook/1.0' \
              --request POST \
              "$DOKPLOY_DEPLOY_HOOK"
          )

          echo "Dokploy hook HTTP $response_code"
          if [[ ! "$response_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Dokploy did not accept the production deployment request." >&2
            exit 1
          fi
