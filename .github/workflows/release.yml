name: Release

on:
  push:
    branches:
      - production
    tags:
      - 'v*'

jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    # Same image as ci.yml and theme/scripts/update-visual-baselines.sh: the committed
    # screenshot baselines are compared byte for byte here, not on the bare runner.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    env:
      SL_VISUAL_BASELINE_ENV: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: theme/package-lock.json

      - name: Pin the screenshot fonts exactly as the baseline script does
        run: |
          mkdir -p "$HOME/.config/fontconfig"
          cp theme/tests/browser/fonts.conf "$HOME/.config/fontconfig/fonts.conf"

      - name: Unit, Chromium and screenshot baseline tests of the login theme
        working-directory: theme
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm test
          npm run test:browser

      - name: Keep screenshot diffs when the visual baselines drift
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: theme-visual-diffs
          path: theme/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The candidate is built here once. keycloak-integration runs the harness's groups on its exact
  # bytes in parallel and keycloak-package approves and packages them; neither rebuilds it. Every
  # later job loads this one tarball only after checking its SHA-256 against this job's output, and
  # checks the loaded image ID against the built one.
  keycloak-build:
    runs-on: ubuntu-latest
    needs: theme
    timeout-minutes: 30
    permissions: { contents: read }
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      integration-groups: ${{ steps.integration_groups.outputs.groups }}
      image-id: ${{ steps.candidate.outputs.image-id }}
      image-sha256: ${{ steps.candidate.outputs.image-sha256 }}
    env:
      KEYCLOAK_TEST_IMAGE: e-skylab-keycloak-candidate:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the release to point at current production
        run: |
          git fetch --no-tags origin production
          release_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          production_commit=$(git rev-parse origin/production)
          if [[ "$release_commit" != "$production_commit" ]]; then
            echo "The Keycloak release must point at the current production commit." >&2
            exit 1
          fi

      - name: Verify Keycloak and fixture image pins
        run: |
          bash tests/check-version-consistency.sh
          bash tests/check-fresh-runner.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: theme/package-lock.json

      # Chromium is installed where the harness runs (keycloak-integration), not here.
      - name: Build the source-controlled login theme and check its contract
        working-directory: theme
        run: |
          npm ci --ignore-scripts
          npm run build-keycloak-theme
          bash ../tests/check-theme-contract.sh
          npm run build-welcome-theme
          bash ../tests/check-welcome-theme.sh

      - uses: docker/setup-buildx-action@v4

      - name: Extract and validate version
        id: get_version
        run: |
          approved_version=$(sed -n \
            's|^ARG KEYCLOAK_IMAGE=.*keycloak:\([^@]*\)@sha256:.*|\1|p' \
            Dockerfile)

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version=${GITHUB_REF#refs/tags/v}
            if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "The Keycloak release tag must contain a semantic version." >&2
              exit 1
            fi
            if [[ "$version" != "$approved_version" ]]; then
              echo "Tag version $version does not match image version $approved_version." >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF" == "refs/heads/production" ]]; then
            version=$approved_version
          else
            echo "Only the production branch and semantic version tags may publish Keycloak." >&2
            exit 1
          fi

          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      # The same list CI's integration-group matrix is held to (tests/check-fresh-runner.sh).
      - name: Read the integration groups from the harness
        id: integration_groups
        run: |
          groups=$(sed -n 's/^INTEGRATION_GROUPS=(\([^)]*\))$/\1/p' tests/run-integration.sh)
          if [[ -z $groups ]]; then
            echo "tests/run-integration.sh lists no INTEGRATION_GROUPS." >&2
            exit 1
          fi
          read -r -a group_list <<<"$groups"
          echo "groups=$(printf '%s\n' "${group_list[@]}" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

      - name: Build candidate image once
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.KEYCLOAK_TEST_IMAGE }}

      - name: Save the built candidate for the integration groups
        id: candidate
        run: |
          set -o pipefail
          candidate_dir="$RUNNER_TEMP/keycloak-test-candidate"
          mkdir -p "$candidate_dir"
          docker save "$KEYCLOAK_TEST_IMAGE" | gzip -1 > "$candidate_dir/candidate-image.tar.gz"
          image_id=$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")
          image_sha256=$(sha256sum "$candidate_dir/candidate-image.tar.gz" | cut -d' ' -f1)
          echo "image-id=$image_id" >> "$GITHUB_OUTPUT"
          echo "image-sha256=$image_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the built candidate for the integration groups
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-test-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/keycloak-test-candidate
          if-no-files-found: error
          retention-days: 1
          # The tarball is gzip already.
          compression-level: 0

  # tests/run-integration.sh in the groups CI runs (INTEGRATION_GROUP; .github/workflows/ci.yml,
  # integration-group), one job per group, all on the bytes keycloak-build saved. The whole harness
  # in one job took over two hours (run 38293603610); a group takes 40-66 minutes in CI on
  # 2026-10-12. A failed group can be re-run alone (gh run rerun --failed): keycloak-build is not
  # re-run, so the re-run group loads the same tarball and its receipt must name the same image.
  keycloak-integration:
    name: integration (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: keycloak-build
    # CI's group timeouts are 80-85 minutes; the release gives the slowest runner more room.
    timeout-minutes: 100
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.keycloak-build.outputs.integration-groups) }}
    env:
      KEYCLOAK_TEST_IMAGE: e-skylab-keycloak-candidate:${{ github.sha }}
      INTEGRATION_GROUP: ${{ matrix.group }}
      IMAGE_ID: ${{ needs.keycloak-build.outputs.image-id }}
      IMAGE_SHA256: ${{ needs.keycloak-build.outputs.image-sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify Keycloak and fixture image pins
        run: |
          bash tests/check-version-consistency.sh
          bash tests/check-fresh-runner.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: theme/package-lock.json

      # The harness's browser stages run Playwright from theme/.
      - name: Install Chromium for the harness
        working-directory: theme
        timeout-minutes: 20
        run: |
          npm ci --ignore-scripts
          # The runner's apt mirror can hang (CI run 37664358276): each attempt gets 5 minutes,
          # three attempts.
          for attempt in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "playwright install attempt $attempt failed or timed out; retrying" >&2
          done

      - name: Download the built candidate
        uses: actions/download-artifact@v5
        with:
          name: keycloak-test-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/keycloak-test-candidate

      - name: Verify and load the built candidate
        run: |
          set -o pipefail
          [[ $IMAGE_SHA256 =~ ^[0-9a-f]{64}$ && $IMAGE_ID =~ ^sha256:[0-9a-f]{64}$ ]]
          candidate="$RUNNER_TEMP/keycloak-test-candidate/candidate-image.tar.gz"
          printf '%s  %s\n' "$IMAGE_SHA256" "$candidate" | sha256sum --check --strict
          if docker image inspect "$KEYCLOAK_TEST_IMAGE" >/dev/null 2>&1; then
            echo "$KEYCLOAK_TEST_IMAGE exists before the candidate is loaded." >&2
            exit 1
          fi
          gzip -dc "$candidate" | docker load
          test "$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")" = "$IMAGE_ID"

      - name: Test candidate image
        run: bash tests/run-integration.sh

      - name: Record the image this group tested
        run: |
          receipt_dir="$RUNNER_TEMP/keycloak-tested"
          mkdir -p "$receipt_dir"
          tested_id=$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")
          printf 'group=%s\ncommit=%s\nimage-id=%s\nimage-sha256=%s\n' \
            "$INTEGRATION_GROUP" "$GITHUB_SHA" "$tested_id" "$IMAGE_SHA256" \
            > "$receipt_dir/$INTEGRATION_GROUP"

      - name: Upload this group's receipt
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-tested-${{ github.sha }}-${{ matrix.group }}
          path: ${{ runner.temp }}/keycloak-tested
          if-no-files-found: error
          retention-days: 1

  # Runs only when every integration group passed (needs). It loads the same tarball, requires a
  # receipt from every group of the harness naming exactly that image, then the physical WebAuthn
  # evidence (the keycloak-production environment's variables), and only then packages those bytes
  # for keycloak-publish.
  keycloak-package:
    runs-on: ubuntu-latest
    needs: [keycloak-build, keycloak-integration]
    environment: keycloak-production
    timeout-minutes: 30
    permissions: { contents: read }
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      KEYCLOAK_TEST_IMAGE: e-skylab-keycloak-candidate:${{ github.sha }}
      IMAGE_ID: ${{ needs.keycloak-build.outputs.image-id }}
      IMAGE_SHA256: ${{ needs.keycloak-build.outputs.image-sha256 }}
      VERSION: ${{ needs.keycloak-build.outputs.version }}
      PHYSICAL_WEBAUTHN_APPROVED_COMMIT: ${{ vars.KEYCLOAK_PHYSICAL_WEBAUTHN_APPROVED_COMMIT }}
      PHYSICAL_WEBAUTHN_EVIDENCE_URL: ${{ vars.KEYCLOAK_PHYSICAL_WEBAUTHN_EVIDENCE_URL }}
      PHYSICAL_WEBAUTHN_APPROVED_SURFACES: ${{ vars.KEYCLOAK_PHYSICAL_WEBAUTHN_APPROVED_SURFACES }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the built candidate
        uses: actions/download-artifact@v5
        with:
          name: keycloak-test-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/keycloak-test-candidate

      - name: Download the integration groups' receipts
        uses: actions/download-artifact@v5
        with:
          pattern: keycloak-tested-${{ github.sha }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/keycloak-tested

      - name: Require every integration group to have tested these bytes
        run: |
          [[ $IMAGE_SHA256 =~ ^[0-9a-f]{64}$ && $IMAGE_ID =~ ^sha256:[0-9a-f]{64}$ ]]
          receipt_dir="$RUNNER_TEMP/keycloak-tested"
          groups=$(sed -n 's/^INTEGRATION_GROUPS=(\([^)]*\))$/\1/p' tests/run-integration.sh)
          read -r -a group_list <<<"$groups"
          if [[ ${#group_list[@]} -eq 0 ]]; then
            echo "tests/run-integration.sh lists no INTEGRATION_GROUPS." >&2
            exit 1
          fi
          for group in "${group_list[@]}"; do
            expected=$(printf 'group=%s\ncommit=%s\nimage-id=%s\nimage-sha256=%s\n' \
              "$group" "$GITHUB_SHA" "$IMAGE_ID" "$IMAGE_SHA256")
            if [[ ! -f "$receipt_dir/$group" || "$(cat "$receipt_dir/$group")" != "$expected" ]]; then
              echo "Integration group $group has no receipt for image $IMAGE_ID of commit $GITHUB_SHA." >&2
              exit 1
            fi
          done
          test "$(find "$receipt_dir" -type f | wc -l | tr -d ' ')" = "${#group_list[@]}"

      - name: Require physical WebAuthn rollout evidence for this commit
        run: bash tests/check-physical-webauthn-release.sh

      - name: Package the tested image bytes
        id: package
        run: |
          set -o pipefail
          [[ -n $VERSION ]]
          tested="$RUNNER_TEMP/keycloak-test-candidate/candidate-image.tar.gz"
          printf '%s  %s\n' "$IMAGE_SHA256" "$tested" | sha256sum --check --strict
          gzip -dc "$tested" | docker load
          test "$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")" = "$IMAGE_ID"

          artifact_dir="$RUNNER_TEMP/keycloak-candidate"
          mkdir -p "$artifact_dir"
          docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE" > "$artifact_dir/image-id"
          printf '%s\n' "$GITHUB_SHA" > "$artifact_dir/commit-sha"
          printf '%s\n' "$VERSION" > "$artifact_dir/version"
          # The tarball every integration group loaded, not a fresh docker save.
          cp "$tested" "$artifact_dir/candidate-image.tar.gz"

          provider_dir="$RUNNER_TEMP/tested-keycloak-providers"
          mkdir -p "$provider_dir"
          candidate_container=$(docker create "$KEYCLOAK_TEST_IMAGE")
          trap 'docker rm -f "$candidate_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$candidate_container:/opt/keycloak/providers/." "$provider_dir/"
          test "$(find "$provider_dir" -maxdepth 1 -type f -name 'e-skylab-theme-*.jar' | wc -l | tr -d ' ')" = 1
          cp "$provider_dir/e-skylab-theme-2.0.1.jar" "$artifact_dir/"
          THEME_JAR="$artifact_dir/e-skylab-theme-2.0.1.jar" \
            bash tests/check-theme-contract.sh
          (
            cd "$artifact_dir"
            sha256sum candidate-image.tar.gz e-skylab-theme-2.0.1.jar > SHA256SUMS
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload the commit-bound tested candidate
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/keycloak-candidate
          if-no-files-found: error
          retention-days: 1

  keycloak-publish:
    needs: keycloak-package
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    env:
      KEYCLOAK_TEST_IMAGE: e-skylab-keycloak-candidate:${{ github.sha }}
      PUBLISH_IMAGE: ghcr.io/skylab-kulubu/e-skylab-keycloak
    steps:
      - uses: actions/checkout@v7

      - name: Download the tested candidate
        uses: actions/download-artifact@v5
        with:
          name: keycloak-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/keycloak-candidate

      - name: Verify and load the tested candidate
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/keycloak-candidate
          VERSION: ${{ needs.keycloak-package.outputs.version }}
        run: |
          test "$(cat "$CANDIDATE_DIR/commit-sha")" = "$GITHUB_SHA"
          test "$(cat "$CANDIDATE_DIR/version")" = "$VERSION"
          (
            cd "$CANDIDATE_DIR"
            sha256sum --check SHA256SUMS
          )
          gzip -dc "$CANDIDATE_DIR/candidate-image.tar.gz" | docker load
          test "$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")" = "$(cat "$CANDIDATE_DIR/image-id")"

          provider_dir="$RUNNER_TEMP/keycloak-providers"
          mkdir -p "$provider_dir"
          candidate_container=$(docker create "$KEYCLOAK_TEST_IMAGE")
          trap 'docker rm -f "$candidate_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$candidate_container:/opt/keycloak/providers/." "$provider_dir/"
          test "$(find "$provider_dir" -maxdepth 1 -type f -name 'e-skylab-theme-*.jar' | wc -l | tr -d ' ')" = 1
          cmp "$provider_dir/e-skylab-theme-2.0.1.jar" "$CANDIDATE_DIR/e-skylab-theme-2.0.1.jar"
          THEME_JAR="$CANDIDATE_DIR/e-skylab-theme-2.0.1.jar" \
            bash tests/check-theme-contract.sh

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image bytes
        env:
          VERSION: ${{ needs.keycloak-package.outputs.version }}
        run: |
          commit_image="$PUBLISH_IMAGE:sha-$GITHUB_SHA"
          production_image="$PUBLISH_IMAGE:production"
          candidate_id=$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")

          published_images=(
            "$commit_image"
            "$production_image"
          )

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            published_images+=(
              "$PUBLISH_IMAGE:$VERSION"
              "$PUBLISH_IMAGE:latest"
            )
          fi

          for image in "${published_images[@]}"; do
            docker tag "$KEYCLOAK_TEST_IMAGE" "$image"
            test "$(docker image inspect --format '{{.Id}}' "$image")" = "$candidate_id"
            docker push "$image"
          done

          commit_digest="sha256:$(docker buildx imagetools inspect --raw "$commit_image" | sha256sum | cut -d' ' -f1)"
          for image in "${published_images[@]:1}"; do
            alias_digest="sha256:$(docker buildx imagetools inspect --raw "$image" | sha256sum | cut -d' ' -f1)"
            test "$commit_digest" = "$alias_digest"
          done

          {
            echo "### Tested Keycloak artifact"
            echo
            echo "\`$commit_image@$commit_digest\`"
            echo
            echo "Production alias: \`production\`"
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo
              echo "Version aliases: \`$VERSION\`, \`latest\`"
            fi
            echo
            echo "Candidate commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger the production Dokploy deployment
        if: github.ref == 'refs/heads/production'
        env:
          DOKPLOY_DEPLOY_HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
        run: |
          if [[ -z "$DOKPLOY_DEPLOY_HOOK" ]]; then
            echo "DOKPLOY_DEPLOY_HOOK is required for production deployment." >&2
            exit 1
          fi

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          response_code=$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --user-agent 'DokployDeployHook/1.0' \
              --request POST \
              "$DOKPLOY_DEPLOY_HOOK"
          )

          echo "Dokploy hook HTTP $response_code"
          if [[ ! "$response_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Dokploy did not accept the production deployment request." >&2
            exit 1
          fi
