name: CI

# Two sizes of the same workflow (job "scope (full|fast)" says which one a run is; mode decides):
# - full: every job below. Pushes to main, the nightly schedule, a manual run (workflow_dispatch,
#   also on a PR branch: gh workflow run ci.yml --ref <branch>), pull requests into main labelled
#   full-ci (the label is read when the PR is opened or pushed to; adding it starts a manual run of
#   the branch at once, full-ci.yml), and pull requests into and
#   pushes to production whose tree no fully green full run has tested yet (a hotfix).
# - fast: pull requests into main, and pull requests into and pushes to production whose tree a
#   fully green full push, schedule or workflow_dispatch run already tested (the release PR and
#   the release push after main's push run; tests/find-green-full-ci-run.sh). Static checks, the
#   image build and the short contract jobs, each only when the paths it reads changed (scope);
#   in a pull request into main a tests/ or config/ path runs only the jobs that read it, and also
#   the whole suite's jobs its diff affects that fit a pull request's 15 minutes (tests/affected-
#   jobs.sh --pull-request; the longer ones, PR_DEFERRED there, run on main's push). A fast
#   production run runs none of the whole suite's jobs.
# A full run builds the candidate image once (candidate); every integration group tests those
# bytes and leaves a receipt, and release.yml promotes them instead of building and testing again.
# One required check: gate. It fails when any job fails or is cancelled, and in a full run also
# when any job was skipped. release.yml publishes only a tree a fully green full run has tested.
on:
  pull_request:
  push:
    branches: [main, production]
  schedule:
    # Every night 01:23 UTC on main.
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run, and a new push to main cancels main's older
# push run: only main's newest tree is released, so the older one is an intermediate tree. The
# event is part of the group, so a push run never cancels a schedule, manual or PR run (nor the
# other way round); production pushes, the schedule and manual runs are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  # full or fast. Every run but a pull request into main without full-ci may be full (ELIGIBLE);
  # a production one (PRODUCTION) is fast when a fully green full run already tested its tree.
  mode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, actions: read }
    outputs:
      full: ${{ steps.mode.outputs.full }}
      promoted-from: ${{ steps.mode.outputs.promoted-from }}
    steps:
      - uses: actions/checkout@v7

      - name: Choose the full or the fast set
        id: mode
        env:
          ELIGIBLE: ${{ (github.event_name != 'pull_request' || github.base_ref != 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'true' || 'false' }}
          PRODUCTION: ${{ ((github.event_name == 'pull_request' && github.base_ref == 'production') || (github.event_name == 'push' && github.ref == 'refs/heads/production')) && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          full=$ELIGIBLE
          promoted_from=''
          if [[ $ELIGIBLE == true && $PRODUCTION == true ]]; then
            tree=$(git rev-parse 'HEAD^{tree}')
            if promoted_from=$(bash tests/find-green-full-ci-run.sh "$tree") && [[ $promoted_from =~ ^[0-9]+$ ]]; then
              echo "tree $tree passed CI run $promoted_from in full: the fast set"
              full=false
            else
              echo "no full green run of tree $tree yet: the whole suite"
              promoted_from=''
            fi
          fi
          printf 'full=%s\npromoted-from=%s\n' "$full" "$promoted_from" >> "$GITHUB_OUTPUT"

  # Which areas a fast run touches: theme/, spi/, and other (anything outside theme/, spi/, docs/
  # and *.md; in a pull request into main also outside tests/ and config/). A full run, or a diff
  # that cannot be read, selects everything (a pull request: every job it may run).
  # affected (pull requests into main only): the jobs whose own tests a fast run's diff touches
  # (tests/affected-jobs.sh --pull-request): the fast set's jobs a tests/ or config/ path reaches,
  # and the whole suite's but PR_DEFERRED (their names go to the log and the run's summary; main's
  # push run is full). A fast production run promotes a tree a full run already tested, so it runs
  # none of the whole suite's jobs (affected is empty).
  scope:
    name: scope (${{ needs.mode.outputs.full == 'true' && 'full' || 'fast' }})
    needs: mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      theme: ${{ steps.scope.outputs.theme }}
      spi: ${{ steps.scope.outputs.spi }}
      other: ${{ steps.scope.outputs.other }}
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out GitHub's merge commit: HEAD^1 is the base it merges into; a
          # push to production its squash commit: HEAD^1 is the production it replaces.
          fetch-depth: 2

      - name: Choose the full or the fast set
        id: scope
        env:
          FULL: ${{ needs.mode.outputs.full }}
          # Only a pull request into main runs affected whole-suite jobs; a fast production run
          # promotes a tree a full run already tested.
          AFFECTED_RUN: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') && 'true' || 'false' }}
        run: |
          everything() {
            all=' '
            if [[ $FULL == true ]]; then
              all=" $(bash tests/affected-jobs.sh --entries | cut -d' ' -f1 | tr '\n' ' ')"
            elif [[ $AFFECTED_RUN == true ]]; then
              all=$(bash tests/affected-jobs.sh --pull-request-all)
            fi
            printf 'full=%s\ntheme=true\nspi=true\nother=true\naffected=%s\n' "$FULL" "$all" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [[ $FULL == true ]]; then
            echo 'full run: every job'
            everything
          fi
          if ! changed=$(git diff --name-only --no-renames HEAD^1 HEAD) || [[ -z $changed ]]; then
            echo 'the diff could not be read: every fast job' >&2
            everything
          fi
          theme=false spi=false other=false
          while IFS= read -r path; do
            case $path in
              theme/*) theme=true ;;
              spi/*) spi=true ;;
              docs/* | *.md) ;;
              # A pull request into main runs only the jobs that read the path (affected).
              tests/* | config/*) [[ $AFFECTED_RUN == true ]] || other=true ;;
              *) other=true ;;
            esac
          done <<<"$changed"
          affected=' '
          if [[ $AFFECTED_RUN == true ]]; then
            later="$RUNNER_TEMP/affected-later"
            if ! affected=$(bash tests/affected-jobs.sh --pull-request <<<"$changed" 2>"$later"); then
              cat "$later" >&2
              exit 1
            fi
            if [[ -s $later ]]; then
              cat "$later"
              # An annotation, so the pull request's checks page shows it too.
              while IFS= read -r line; do
                echo "::warning title=Long jobs left to main's push run::$line"
              done <"$later"
              { echo "### Long jobs left to main's push run"; echo; cat "$later"; } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          printf 'fast run: theme=%s spi=%s other=%s affected=[%s]\n' "$theme" "$spi" "$other" "$affected"
          printf 'full=false\ntheme=%s\nspi=%s\nother=%s\naffected=%s\n' "$theme" "$spi" "$other" "$affected" >> "$GITHUB_OUTPUT"

  # Every run: the version pins, the workflow wiring, the theme contracts, the image build (which
  # runs the SPI's and the RabbitMQ provider's Maven tests) and the operator scripts' static
  # checks that tests/run-integration.sh also runs first.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KEYCLOAK_TEST_IMAGE: account-keycloak:static
    steps:
      - uses: actions/checkout@v7

      - name: Verify Keycloak and fixture image pins and the workflow wiring
        run: |
          bash tests/check-version-consistency.sh
          bash tests/check-fresh-runner.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: theme/package-lock.json

      - name: Build the login and landing page themes and check their contracts
        working-directory: theme
        run: |
          npm ci --ignore-scripts
          npm run build-keycloak-theme
          bash ../tests/check-theme-contract.sh
          npm run build-welcome-theme
          bash ../tests/check-welcome-theme.sh

      - uses: docker/setup-buildx-action@v4

      - name: Build the Keycloak image (SPI and RabbitMQ provider tests included)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.KEYCLOAK_TEST_IMAGE }}
          # Reads the layers the integration groups cache on main; writes none.
          cache-from: type=gha

      - name: Operator script static checks
        run: |
          bash tests/check-production-preflight.sh
          bash tests/check-account-center-origin.sh
          bash tests/check-operator-login-prompts.sh
          bash tests/check-site-editor-grants-team.sh
          bash tests/check-app-assignments.sh

  theme:
    needs: scope
    if: needs.scope.outputs.theme == 'true' || needs.scope.outputs.other == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The visual baselines in theme/tests/browser/visual.spec.ts-snapshots are rendered in this
    # exact image by theme/scripts/update-visual-baselines.sh; keep the tag and the
    # @playwright/test pin in theme/package.json in step.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    env:
      # Marks the image the screenshot baselines were rendered in, so visual.spec.ts runs.
      SL_VISUAL_BASELINE_ENV: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: theme/package-lock.json

      - name: Pin the screenshot fonts exactly as the baseline script does
        run: |
          mkdir -p "$HOME/.config/fontconfig"
          cp theme/tests/browser/fonts.conf "$HOME/.config/fontconfig/fonts.conf"

      - name: Unit, Chromium and screenshot baseline tests of the login theme
        working-directory: theme
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm test
          npm run test:browser

      - name: Keep screenshot diffs when the visual baselines drift
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: theme-visual-diffs
          path: theme/test-results
          if-no-files-found: ignore
          retention-days: 7

  # config/inscribed-cms-roles.sh against the stock Keycloak image (Dockerfile KEYCLOAK_IMAGE) in
  # dev mode; needs no build of this repository's image.
  inscribed-cms-roles:
    needs: [mode, scope]
    if: needs.mode.outputs.full == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' inscribed-cms-roles ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: inscribed roles script against a throwaway Keycloak
        run: bash tests/inscribed-cms-roles.sh

  # config/sandbox-site-clients.sh (and inscribed-cms-roles.sh after it) against the stock Keycloak
  # image in dev mode, with a real authorization code flow; needs no build of this repository's image.
  sandbox-site-clients:
    needs: scope
    if: needs.scope.outputs.other == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' sandbox-site-clients ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: sandbox site clients script against a throwaway Keycloak
        run: bash tests/sandbox-site-clients.sh

  # config/create-place-client.sh (Place's login client, ADR-0060) against the stock Keycloak image
  # in dev mode, with a real authorization code flow (PKCE); needs no build of this repository's image.
  place-client:
    needs: scope
    if: needs.scope.outputs.other == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' place-client ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Place client script against a throwaway Keycloak
        run: bash tests/place-client.sh

  # config/forms-skymail-grants.sh (SkyMail's send permission for Forms' service account) against the
  # stock Keycloak image in dev mode, with real client-credentials tokens and userinfo; needs no build
  # of this repository's image.
  forms-skymail-grants:
    needs: scope
    if: needs.scope.outputs.other == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' forms-skymail-grants ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Forms SkyMail grants script against a throwaway Keycloak
        run: bash tests/forms-skymail-grants.sh

  # config/role-groups.sh (/ROLLER application role groups) and config/leader-app-roles.sh (the Forms
  # seat on the top teams' Leader groups), also as the reconciler's operator steps, against the stock
  # Keycloak image in dev mode, with real password-grant tokens; needs no build of this repository's
  # image.
  role-groups:
    needs: [mode, scope]
    if: needs.mode.outputs.full == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' role-groups ')
    runs-on: ubuntu-latest
    # app-assignments.sh --check reads every role's holders (two kcadm reads a role): minutes a run,
    # the drift alarm's runs on the sandbox (ekip-yetkileri ticket 07) included.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7

      - name: Role groups and Leader application roles against a throwaway Keycloak
        run: bash tests/role-groups.sh

  # DK reads and does not write (grup-yonetimi 08): the reconciler's core-roles step seeds DK's read
  # roles, config/dk-read-only.sh takes DK's write roles away once (dry run, --apply with a backup,
  # --restore, --forms), against the stock Keycloak image in dev mode with real password-grant
  # tokens; needs no build of this repository's image.
  dk-read-only:
    needs: [mode, scope]
    if: needs.mode.outputs.full == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' dk-read-only ')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: DK read-only roles against a throwaway Keycloak
        run: bash tests/dk-read-only.sh

  # The master realm's console (rol-temizligi 03): config/master-console.sh (console groups,
  # brute force, events, the passkey flow of the console) against the stock Keycloak image in dev
  # mode, with people's own Admin REST tokens and the real console in Chromium with a virtual
  # authenticator; needs no build of this repository's image.
  master-console:
    needs: [mode, scope]
    if: needs.mode.outputs.full == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' master-console ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: theme/package-lock.json

      - name: Install the passkey test browser
        working-directory: theme
        run: |
          npm ci --ignore-scripts
          # Chromium only, from Playwright's download host: the runner image already has its
          # libraries, and --with-deps's apt mirror stalls (CI run 40311997516). apt only when a
          # launch of both builds the tests use (headless shell, new headless) says one is missing.
          npx --no-install playwright install chromium
          node -e 'const { chromium } = require("@playwright/test"); (async () => { for (const channel of [undefined, "chromium"]) await (await chromium.launch({ channel })).close(); })();' \
            || npx --no-install playwright install-deps chromium

      - name: Master console groups, hardening and passkey sign-in against a throwaway Keycloak
        run: bash tests/master-console.sh

  # config/sandbox-admin-local-client.sh (the admin panel's local-development client admin-local,
  # sandbox realm only) against the stock Keycloak image in dev mode, with real authorization code
  # flows (PKCE) through admin-local and the panel's client; needs no build of this repository's image.
  sandbox-admin-local-client:
    needs: [mode, scope]
    if: needs.mode.outputs.full == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' sandbox-admin-local-client ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: sandbox admin-local client script against a throwaway Keycloak
        run: bash tests/sandbox-admin-local-client.sh

  # config/fill-missing-primary-from-school.sh (eskylab-login-ux 06: an account without a Primary
  # e-mail gets its School e-mail) against the stock Keycloak image in dev mode, with the production
  # User Profile and one account per case; needs no build of this repository's image.
  fill-missing-primary-from-school:
    needs: scope
    if: needs.scope.outputs.other == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' fill-missing-primary-from-school ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Primary e-mail fill script against a throwaway Keycloak
        run: bash tests/fill-missing-primary-from-school.sh

  # The first YTÜ login (eskylab-login-ux 07): the SPI's sky-ytu-first-login step and the
  # reconciler's first broker login step (KEYCLOAK_RECONCILE_ONLY=first-broker-login,
  # KEYCLOAK_YTU_FIRST_LOGIN) against the stock Keycloak image in dev mode, with the SPI jar built
  # from spi/ in the Dockerfile's Maven image, a mock YTÜ tenant behind OBS and real logins; needs
  # no build of this repository's image. Then the one-time Personal e-mail offer at its end
  # (ticket 21, required action sky-personal-email-offer, KEYCLOAK_PERSONAL_EMAIL_OFFER), with
  # codes read from the integration harness's pinned Mailpit image, and the "Bu cihazda oturumum açık
  # kalsın mı?" question after every YTÜ login (required action sky-stay-signed-in,
  # KEYCLOAK_STAY_SIGNED_IN).
  ytu-first-login:
    needs: [mode, scope]
    if: needs.mode.outputs.full == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' ytu-first-login ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: First YTÜ login against a throwaway Keycloak
        run: bash tests/ytu-first-login.sh

  # "E-postayla devam et" (eskylab-login-ux 08): the SPI's sky-email-code step and the reconciler's
  # e-mail code step (KEYCLOAK_RECONCILE_ONLY=email-code-login, KEYCLOAK_EMAIL_CODE_LOGIN) against the
  # stock Keycloak image in dev mode, with the SPI jar built from spi/ in the Dockerfile's Maven image,
  # production's browser flow shape, codes read from the integration harness's pinned Mailpit image
  # and real logins (password, code, code then TOTP); needs no build of this repository's image.
  # The login theme is built too, so the last stage proves its contract with the step (08b).
  login-by-email-code:
    needs: scope
    if: needs.scope.outputs.spi == 'true' || needs.scope.outputs.theme == 'true' || needs.scope.outputs.other == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' login-by-email-code ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: theme/package-lock.json

      - name: Build the login theme
        working-directory: theme
        run: |
          npm ci --ignore-scripts
          npm run build-keycloak-theme

      - name: Sign-in with an e-mail code against a throwaway Keycloak
        run: LOGIN_BY_EMAIL_CODE_THEME_JAR=theme/dist_keycloak/e-skylab-theme-2.0.1.jar bash tests/login-by-email-code.sh

  # Separate from the full login regression: PostgreSQL18, two independent Keycloak instances,
  # account-counter races/restarts, real UserProfile API negatives and token/reset fault gates.
  # The targeted baseline took 149s / 70 assertions on the developer Mac; no old login gate is removed.
  email-code-persistent-counter:
    needs: scope
    if: needs.scope.outputs.spi == 'true' || needs.scope.outputs.theme == 'true' || needs.scope.outputs.other == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' email-code-persistent-counter ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: theme/package-lock.json

      - name: Build and test the providers
        run: MAVEN_OPTS=-Xmx768m mvn -B -f spi/pom.xml -DargLine=-Xmx512m -DforkCount=1 verify

      - name: Cache the pinned disposable runtime images
        run: |
          keycloak_image=$(sed -n 's/^ARG KEYCLOAK_IMAGE=//p' Dockerfile)
          node_image=$(sed -n 's/^ARG NODE_IMAGE=//p' Dockerfile)
          mailpit_image=$(sed -n 's/^ *image: \(ghcr\.io\/axllent\/mailpit:[^ ]*\)$/\1/p' tests/docker-compose.integration.yml)
          postgres_image=$(sed -n 's/^export LOGIN_BY_EMAIL_CODE_POSTGRES_IMAGE=//p' tests/login-code-persistent.sh)
          docker pull "$keycloak_image"
          docker pull "$node_image"
          docker pull "$mailpit_image"
          docker pull "$postgres_image"

      - name: Persistent counter HTTP, API and token fault contract
        run: |
          LOGIN_BY_EMAIL_CODE_SPI_JAR=$(find "$PWD/spi/target" -maxdepth 1 -name 'e-skylab-spi-*.jar' -print -quit)
          export LOGIN_BY_EMAIL_CODE_SPI_JAR
          LOGIN_BY_EMAIL_CODE_TEST_PULL=never bash tests/login-code-persistent.sh

      - name: Install the native passkey test browser
        working-directory: theme
        run: |
          npm ci --ignore-scripts
          # Chromium only, from Playwright's download host: the runner image already has its
          # libraries, and --with-deps's apt mirror stalls (CI run 40311997516). apt only when a
          # launch of both builds the tests use (headless shell, new headless) says one is missing.
          npx --no-install playwright install chromium
          node -e 'const { chromium } = require("@playwright/test"); (async () => { for (const channel of [undefined, "chromium"]) await (await chromium.launch({ channel })).close(); })();' \
            || npx --no-install playwright install-deps chromium

      - name: LINK counter, native callback fault and alternate-login reset contract
        run: |
          B12_SPI_JAR=$(find "$PWD/spi/target" -maxdepth 1 -name 'e-skylab-spi-*.jar' -print -quit)
          export B12_SPI_JAR
          bash tests/existing-account-counter.sh

      - name: Keep the native passkey browser trace when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: email-code-persistent-counter-trace
          path: theme/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Registration continuation: native AIA cancellation, policy/password/passkey choices,
  # original OIDC state/nonce/PKCE, closed partial swaps and unchanged ordinary-login offers.
  after-sign-up-native:
    needs: [mode, scope]
    if: needs.mode.outputs.full == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' after-sign-up-native ')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: theme/package-lock.json
      - name: Build and test the providers
        run: MAVEN_OPTS=-Xmx768m mvn -B -f spi/pom.xml -DargLine=-Xmx512m -DforkCount=1 verify
      - name: Build the actual login theme and install the native test browser
        working-directory: theme
        run: |
          npm ci --ignore-scripts
          npm run build-keycloak-theme
          bash ../tests/check-theme-contract.sh
          # Chromium only, from Playwright's download host: the runner image already has its
          # libraries, and --with-deps's apt mirror stalls (CI run 40311997516). apt only when a
          # launch of both builds the tests use (headless shell, new headless) says one is missing.
          npx --no-install playwright install chromium
          node -e 'const { chromium } = require("@playwright/test"); (async () => { for (const channel of [undefined, "chromium"]) await (await chromium.launch({ channel })).close(); })();' \
            || npx --no-install playwright install-deps chromium
      - name: Cache pinned disposable runtime images
        run: |
          docker pull "$(sed -n 's/^ARG KEYCLOAK_IMAGE=//p' Dockerfile)"
          docker pull "$(sed -n 's/^ *image: \(ghcr\.io\/axllent\/mailpit:[^ ]*\)$/\1/p' tests/docker-compose.integration.yml)"
          docker pull "$(sed -n 's/^export B12_PG_IMAGE=//p' tests/after-sign-up.sh)"
      - name: Registration, native YTU and optional credential contract
        run: |
          B12_SPI_JAR=$(find "$PWD/spi/target" -maxdepth 1 -name 'e-skylab-spi-*.jar' -print -quit)
          export B12_SPI_JAR
          B10_THEME_JAR="$PWD/theme/dist_keycloak/e-skylab-theme-2.0.1.jar" bash tests/after-sign-up.sh

  # The SPI's microsoft identity provider: Keycloak's re-authentication (max_age exceeded,
  # prompt=login) goes to Microsoft as prompt=login; an ordinary first login and SSO unchanged;
  # SKY_FORWARD_REAUTHENTICATION=false gives Keycloak's own behaviour back. Stock Keycloak image
  # in dev mode with the SPI jar built from spi/ in the Dockerfile's Maven image; only Keycloak's
  # redirect is read, Microsoft is never called.
  microsoft-reauthentication:
    needs: scope
    if: needs.scope.outputs.spi == 'true' || needs.scope.outputs.other == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' microsoft-reauthentication ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Re-authentication forwarded to Microsoft against a throwaway Keycloak
        run: bash tests/microsoft-reauthentication.sh

  # Self-registration on "E-postayla devam et" (eskylab-login-ux 09): the sign-up branch of the SPI's
  # sky-email-code step and the reconciler's sign-up setting (KEYCLOAK_EMAIL_CODE_SIGN_UP) against the
  # stock Keycloak image in dev mode, with the SPI jar built from spi/ in the Dockerfile's Maven image,
  # production's browser flow shape and User Profile, the SkyMail fixture and Mailpit; real sign-ups,
  # a YTÜ address, "Hesap aç" with an account and two sign-ups of one address at once. Needs no build of
  # this repository's image.
  sign-up-by-email-code:
    needs: scope
    if: needs.scope.outputs.spi == 'true' || needs.scope.outputs.other == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' sign-up-by-email-code ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Sign-up with an e-mail code against a throwaway Keycloak
        run: bash tests/sign-up-by-email-code.sh

  # First Microsoft login: explicit account choice, target-bound native proof and the
  # callback transaction guard, including real PG locks/rollback and a resident passkey.
  # The Microsoft transport/barrier fixtures are compiled into a separate test-only JAR.
  existing-account-link:
    needs: scope
    if: needs.scope.outputs.spi == 'true' || needs.scope.outputs.theme == 'true' || needs.scope.outputs.other == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' existing-account-link ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      B12_PG_IMAGE: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: theme/package-lock.json

      - name: Build and test the providers
        run: MAVEN_OPTS=-Xmx768m mvn -B -f spi/pom.xml -DargLine=-Xmx512m -DforkCount=1 verify

      - name: Install the native passkey test browser
        working-directory: theme
        run: |
          npm ci --ignore-scripts
          # Chromium only, from Playwright's download host: the runner image already has its
          # libraries, and --with-deps's apt mirror stalls (CI run 40311997516). apt only when a
          # launch of both builds the tests use (headless shell, new headless) says one is missing.
          npx --no-install playwright install chromium
          node -e 'const { chromium } = require("@playwright/test"); (async () => { for (const channel of [undefined, "chromium"]) await (await chromium.launch({ channel })).close(); })();' \
            || npx --no-install playwright install-deps chromium

      - name: Cache the pinned disposable runtime images
        run: |
          keycloak_image=$(sed -n 's/^ARG KEYCLOAK_IMAGE=//p' Dockerfile)
          mailpit_image=$(sed -n 's/^ *image: \(ghcr\.io\/axllent\/mailpit:[^ ]*\)$/\1/p' tests/docker-compose.integration.yml)
          docker pull "$keycloak_image"
          docker pull "$mailpit_image"
          docker pull "$B12_PG_IMAGE"

      - name: Existing-account proof and callback races against PostgreSQL and Keycloak
        run: |
          B12_SPI_JAR=$(find "$PWD/spi/target" -maxdepth 1 -name 'e-skylab-spi-*.jar' -print -quit)
          export B12_SPI_JAR
          bash tests/existing-account-link.sh

      - name: Keep the native passkey browser trace when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: existing-account-link-trace
          path: theme/test-results
          if-no-files-found: ignore
          retention-days: 7

  # config/site-clients.sh and config/site-editor-grants.sh (the event sites' Site clients, with
  # inscribed-cms-roles.sh between them) against the stock Keycloak image in dev mode, with a real
  # authorization code flow (PKCE); needs no build of this repository's image.
  site-clients:
    needs: [mode, scope]
    if: needs.mode.outputs.full == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' site-clients ')
    runs-on: ubuntu-latest
    # 19-28 minutes on main before the --shared-scope stage (about 5 more).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: event site clients and editor grants against a throwaway Keycloak
        run: bash tests/site-clients.sh

  # config/skyapp-cms-editor.sh (SkyApp edits the main site's News and Teams, ADR-0056 addendum of
  # 2026-10-03), with inscribed-cms-roles.sh before it, against the stock Keycloak image in dev mode,
  # with SkyApp's real public-client login (PKCE) and refresh; needs no build of this repository's image.
  skyapp-cms-editor:
    needs: [mode, scope]
    if: needs.mode.outputs.full == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' skyapp-cms-editor ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: SkyApp CMS editing against a throwaway Keycloak
        run: bash tests/skyapp-cms-editor.sh

  # The reconciler's login client step (frontend-main, frontend-arge, skymail narrowed to the APIs
  # their apps call; KEYCLOAK_RECONCILE_ONLY=login-clients) against the stock Keycloak image in dev
  # mode, with production-shaped full-scope clients, real logins (PKCE) before and after, userinfo,
  # and the operator scripts that share these clients; needs no build of this repository's image.
  login-clients:
    needs: [mode, scope]
    if: needs.mode.outputs.full == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' login-clients ')
    runs-on: ubuntu-latest
    # ~21 minutes on a loaded developer Mac (2026-10-05); every kcadm call starts a JVM.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: login client narrowing against a throwaway Keycloak
        run: bash tests/login-clients.sh

  # The landing page at / (the e-skylab-welcome theme, rendered from theme/src/welcome) served by
  # the stock Keycloak image in dev mode with the built theme mounted; needs no build of this
  # repository's image.
  welcome-page:
    needs: scope
    if: needs.scope.outputs.theme == 'true' || needs.scope.outputs.other == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' welcome-page ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: theme/package-lock.json

      - name: Build the landing page theme
        working-directory: theme
        run: |
          npm ci --ignore-scripts
          npm run build-welcome-theme

      - name: Landing page at / against a throwaway Keycloak
        run: bash tests/welcome-page.sh

  # Full runs: the candidate image is built once. (integration-group is PR_DEFERRED in
  # tests/affected-jobs.sh, so scope's affected never names it in a pull request into main.) Every integration group loads these bytes
  # (SHA-256 and image ID checked) and uploads a receipt naming them; release.yml (keycloak-build)
  # promotes this artifact of the run that tested its tree, so the published bytes are the tested
  # bytes (only a full push, schedule or manual run counts; never a pull request's). Kept 14 days,
  # as long as tests/find-green-full-ci-run.sh looks back.
  candidate:
    needs: [mode, scope]
    if: needs.mode.outputs.full == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' integration-group ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-id: ${{ steps.candidate.outputs.image-id }}
      image-sha256: ${{ steps.candidate.outputs.image-sha256 }}
    env:
      KEYCLOAK_TEST_IMAGE: e-skylab-keycloak-candidate:ci
    steps:
      - uses: actions/checkout@v7

      - name: Verify Keycloak and fixture image pins
        run: |
          bash tests/check-version-consistency.sh
          bash tests/check-fresh-runner.sh

      - uses: docker/setup-buildx-action@v4

      - name: Build candidate image once
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.KEYCLOAK_TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save the built candidate for the integration groups and the release
        id: candidate
        run: |
          set -o pipefail
          candidate_dir="$RUNNER_TEMP/keycloak-ci-candidate"
          mkdir -p "$candidate_dir"
          docker save "$KEYCLOAK_TEST_IMAGE" | gzip -1 > "$candidate_dir/candidate-image.tar.gz"
          image_id=$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")
          image_sha256=$(sha256sum "$candidate_dir/candidate-image.tar.gz" | cut -d' ' -f1)
          printf '%s\n' "$image_id" > "$candidate_dir/image-id"
          printf '%s\n' "$image_sha256" > "$candidate_dir/image-sha256"
          git rev-parse 'HEAD^{tree}' > "$candidate_dir/tree"
          echo "image-id=$image_id" >> "$GITHUB_OUTPUT"
          echo "image-sha256=$image_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the built candidate
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-ci-candidate
          path: ${{ runner.temp }}/keycloak-ci-candidate
          if-no-files-found: error
          retention-days: 14
          # The tarball is gzip already.
          compression-level: 0

  # tests/run-integration.sh in parallel groups (INTEGRATION_GROUP; the list and what each group
  # runs are at the top of the script). In one job the harness took 96-124 minutes (#79, #80 and
  # main 6321258 on 2026-10-07). Each group starts its own Keycloak and runs the shared realm
  # prefix (17-22 minutes, by runner), so a group takes that prefix plus its share. First split
  # run (#81, run 37656800805): erasure 53, roles 55, login 44 (on a runner whose prefix took 17
  # minutes; about 57 on one that takes 22), spi 53 minutes. Timeouts are about 1.5 times that;
  # the "[harness <group> +MmSSs]" lines of the log show where a group grows.
  # After the host-side Admin REST reads (#130) and the split into six groups (2026-10-20) a group
  # takes about 20-28 minutes; timeouts are about 1.5 times that. The groups do not wait for the
  # theme job: they are the longest jobs of a full run, and behind the theme job they queued after
  # the short jobs (run 39262199516: 31 minutes before the first group started).
  # Full runs (as candidate); every group tests candidate's bytes and records them in a receipt
  # that release.yml requires (of a full push, schedule or manual run).
  integration-group:
    name: integration (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: [mode, scope, candidate]
    if: needs.mode.outputs.full == 'true' || contains(format(' {0} ', needs.scope.outputs.affected), ' integration-group ')
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: erasure
            timeout: 45
          - group: roles
            timeout: 45
          - group: roles-noop
            # Also the whole reconciliation's dry run (ekip-yetkileri ticket 03): about 38 minutes.
            timeout: 55
          - group: login
            timeout: 45
          - group: login-rollback
            timeout: 45
          - group: spi
            timeout: 45
    timeout-minutes: ${{ matrix.timeout }}
    env:
      KEYCLOAK_TEST_IMAGE: e-skylab-keycloak-candidate:ci
      INTEGRATION_GROUP: ${{ matrix.group }}
      IMAGE_ID: ${{ needs.candidate.outputs.image-id }}
      IMAGE_SHA256: ${{ needs.candidate.outputs.image-sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify Keycloak and fixture image pins
        run: |
          bash tests/check-version-consistency.sh
          bash tests/check-fresh-runner.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: theme/package-lock.json

      - name: Build the source-controlled login theme and check its contract
        working-directory: theme
        timeout-minutes: 20
        run: |
          npm ci --ignore-scripts
          # Chromium only, from Playwright's download host: the runner image already has its
          # libraries, and the apt mirror --with-deps used stalls (run 37664358276: 80 minutes in
          # apt-get update; run 40311997516: three 5-minute attempts on a few font packages).
          npx --no-install playwright install chromium
          chromium_launches() {
            node -e 'const { chromium } = require("@playwright/test"); (async () => { for (const channel of [undefined, "chromium"]) await (await chromium.launch({ channel })).close(); })();'
          }
          # apt only when a launch of both builds the tests use (headless shell, new headless) says
          # a library is missing: 30 s a request, three tries; each attempt 5 minutes, three attempts.
          if ! chromium_launches; then
            printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' \
              | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
            for attempt in 1 2 3; do
              timeout -k 10 300 npx --no-install playwright install-deps chromium && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              echo "playwright install-deps attempt $attempt failed or timed out; retrying" >&2
              # timeout stops npx, but the apt-get it started as root keeps the dpkg lock and the next
              # attempt fails at once on /var/lib/dpkg/lock-frontend (run 39946385594): stop it first.
              sudo pkill -KILL -x apt-get || true
              sudo pkill -KILL -x dpkg || true
              sudo dpkg --configure -a || true
            done
            chromium_launches
          fi
          npm run build-keycloak-theme
          bash ../tests/check-theme-contract.sh
          npm run build-welcome-theme
          bash ../tests/check-welcome-theme.sh

      - name: Download the built candidate
        uses: actions/download-artifact@v5
        with:
          name: keycloak-ci-candidate
          path: ${{ runner.temp }}/keycloak-ci-candidate

      - name: Verify and load the built candidate
        run: |
          set -o pipefail
          [[ $IMAGE_SHA256 =~ ^[0-9a-f]{64}$ && $IMAGE_ID =~ ^sha256:[0-9a-f]{64}$ ]]
          candidate="$RUNNER_TEMP/keycloak-ci-candidate/candidate-image.tar.gz"
          printf '%s  %s\n' "$IMAGE_SHA256" "$candidate" | sha256sum --check --strict
          if docker image inspect "$KEYCLOAK_TEST_IMAGE" >/dev/null 2>&1; then
            echo "$KEYCLOAK_TEST_IMAGE exists before the candidate is loaded." >&2
            exit 1
          fi
          gzip -dc "$candidate" | docker load
          test "$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")" = "$IMAGE_ID"

      - name: Run Keycloak, OIDC and RabbitMQ contracts
        run: bash tests/run-integration.sh

      - name: Record the image this group tested
        run: |
          receipt_dir="$RUNNER_TEMP/keycloak-ci-tested"
          mkdir -p "$receipt_dir"
          tested_id=$(docker image inspect --format '{{.Id}}' "$KEYCLOAK_TEST_IMAGE")
          printf 'group=%s\ntree=%s\nimage-id=%s\nimage-sha256=%s\n' \
            "$INTEGRATION_GROUP" "$(git rev-parse 'HEAD^{tree}')" "$tested_id" "$IMAGE_SHA256" \
            > "$receipt_dir/$INTEGRATION_GROUP"

      - name: Upload this group's receipt
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-ci-tested-${{ matrix.group }}
          path: ${{ runner.temp }}/keycloak-ci-tested
          if-no-files-found: error
          retention-days: 14

      - name: Keep only the whitelisted WebAuthn failure diagnostic
        if: failure() && matrix.group == 'spi'
        uses: actions/upload-artifact@v4
        with:
          name: spi-webauthn-safe-diagnostic
          path: theme/test-results/**/webauthn-safe-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7

  # One check named integration, green only when every group is. A fast run (mode) skips the
  # groups; then a skipped matrix passes here too.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [mode, integration-group]
    if: always()
    steps:
      - name: Every integration group passed
        env:
          GROUPS_RESULT: ${{ needs.integration-group.result }}
          FULL: ${{ needs.mode.outputs.full }}
        run: |
          echo "integration groups: $GROUPS_RESULT (full run: $FULL)"
          test "$GROUPS_RESULT" = success || { test "$FULL" = false && test "$GROUPS_RESULT" = skipped; }

  # The one required check. Green when no job failed or was cancelled; a fast run may skip jobs, a
  # full run may not. mode's choice is checked against the event: only a run that may be full is
  # full, and an eligible run is fast only on production, when the finder (run again here) still
  # names a fully green full run of the tree. Pushes to main are always full.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    permissions: { contents: read, actions: read }
    needs:
      - mode
      - scope
      - static
      - theme
      - inscribed-cms-roles
      - sandbox-site-clients
      - place-client
      - forms-skymail-grants
      - role-groups
      - dk-read-only
      - master-console
      - sandbox-admin-local-client
      - fill-missing-primary-from-school
      - ytu-first-login
      - login-by-email-code
      - email-code-persistent-counter
      - after-sign-up-native
      - microsoft-reauthentication
      - sign-up-by-email-code
      - existing-account-link
      - site-clients
      - skyapp-cms-editor
      - login-clients
      - welcome-page
      - candidate
      - integration-group
      - integration
    steps:
      - uses: actions/checkout@v7

      - name: Every selected job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          ELIGIBLE: ${{ (github.event_name != 'pull_request' || github.base_ref != 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'true' || 'false' }}
          PRODUCTION: ${{ ((github.event_name == 'pull_request' && github.base_ref == 'production') || (github.event_name == 'push' && github.ref == 'refs/heads/production')) && 'true' || 'false' }}
          FULL: ${{ needs.mode.outputs.full }}
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<<"$NEEDS"
          test "$(jq -r '.mode.result' <<<"$NEEDS")" = success
          test "$(jq -r '.scope.result' <<<"$NEEDS")" = success
          case "$ELIGIBLE/$PRODUCTION/$FULL" in
            true/*/true | false/*/false) ;;
            true/true/false)
              run_id=$(bash tests/find-green-full-ci-run.sh "$(git rev-parse 'HEAD^{tree}')")
              [[ $run_id =~ ^[0-9]+$ ]]
              ;;
            *)
              echo "mode chose full=$FULL for a run with eligible=$ELIGIBLE production=$PRODUCTION" >&2
              exit 1
              ;;
          esac
          bad=$(jq -r --arg full "$FULL" \
            'to_entries[] | select(.value.result != "success" and ($full == "true" or .value.result != "skipped")) | .key' \
            <<<"$NEEDS")
          if [[ -n $bad ]]; then
            echo "not passed (full run: $FULL): $bad" >&2
            exit 1
          fi
