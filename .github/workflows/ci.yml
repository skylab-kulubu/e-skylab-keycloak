name: CI

on:
  pull_request:
  push:
    branches: [main, production]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYCLOAK_TEST_IMAGE: account-keycloak:ci
    steps:
      - uses: actions/checkout@v7

      - name: Verify Keycloak and fixture image pins
        run: |
          bash tests/check-version-consistency.sh
          bash tests/check-fresh-runner.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: theme/package-lock.json

      - name: Test and build the source-controlled login theme
        working-directory: theme
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm test
          npx playwright install --with-deps chromium
          npm run test:browser
          npm run build-keycloak-theme
          bash ../tests/check-theme-contract.sh

      - uses: docker/setup-buildx-action@v4

      - name: Build optimized Keycloak image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.KEYCLOAK_TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Keycloak, OIDC and RabbitMQ contracts
        run: bash tests/run-integration.sh
